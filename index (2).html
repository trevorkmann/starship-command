<script>
const $=id=>document.getElementById(id),stage=$('stage');
function fit(){let z=Math.min(innerWidth/1536,innerHeight/1024);stage.style.transform=`translate(-50%,-50%) scale(${z})`}addEventListener('resize',fit);fit();
let state={online:false,booting:false,throttle:0,shield:100,hull:100,engine:100,torps:3,contacts:[],lock:-1,radar:true,mode:'FREE',charge:0,charging:false,jumping:false,battle:false,route:'BALANCED',parts:{port:100,starboard:100,fuselage:100,engine:100},switches:{NAV:true,COMMS:true,SENSORS:true,LIFE:true,AUX:false}};
function report(t){$('readout').textContent=t}
function alertText(t){$('alert').textContent=t;$('alert').style.display='block';setTimeout(()=>$('alert').style.display='none',1200)}
function spawnSparks(){let host=$('damageSparks');for(let i=0;i<13;i++){let sp=document.createElement('i');sp.className='spark';sp.style.left=(1220+Math.random()*160)+'px';sp.style.top=(215+Math.random()*100)+'px';sp.style.setProperty('--dx',((Math.random()-.5)*140)+'px');sp.style.setProperty('--dy',(30+Math.random()*130)+'px');host.append(sp);setTimeout(()=>sp.remove(),600)}}
function update(){ $('shield').firstElementChild.style.width=state.shield+'%';$('shieldTxt').textContent=Math.round(state.shield)+'%';$('hull').firstElementChild.style.width=state.hull+'%';$('engines').firstElementChild.style.width=state.engine+'%';$('contacts').textContent='CONTACTS '+String(state.contacts.length).padStart(2,'0');$('target').textContent=state.lock<0?'NO TARGET':'TARGET LOCKED';$('ammo').textContent='TORP '+String(state.torps).padStart(2,'0');$('throttleVal').textContent=state.throttle+'%';$('handle').style.top=(164-state.throttle*1.64)+'px';$('powerTxt').textContent='POWER: '+state.route}
function hitButton(name,x,y,w,h,action){let b=document.createElement('button');b.className='hit';b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;b.setAttribute('aria-label',name);b.title=name;b.addEventListener('click',()=>{b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),170);action()});stage.append(b);return b}
const buttons={};
function add(n,x,y,w,h,fn){buttons[n]=hitButton(n,x,y,w,h,fn)}
function startup(){if(state.online||state.booting)return report('ENGINES ALREADY ACTIVE');if(!state.switches.LIFE)return report('ENABLE LIFE SUPPORT FIRST');state.booting=true;$('boot').style.display='block';let steps=['AUXILIARY POWER — ROUTING','REACTOR — CORE STABILIZING','ENGINE IGNITION — THRUSTERS','FLIGHT CONTROL — ALL SYSTEMS'];let i=0;function step(){if(!state.booting)return;if(i===steps.length){state.booting=false;state.online=true;stage.classList.add('engines-on','power-pulse');setTimeout(()=>stage.classList.remove('power-pulse'),1500);$('boot').style.display='none';report('MAIN ENGINES ONLINE — ALL STATIONS READY');alertText('ENGINES ONLINE');return} $('bootText').textContent=steps[i];$('bootBar').firstElementChild.style.width=(i+1)*25+'%';report(steps[i]);i++;setTimeout(step,1300)}step()}
function shutdown(){state.booting=false;state.online=false;stage.classList.remove('engines-on');state.throttle=0;state.charge=0;state.charging=false;chargeDisplay();$('boot').style.display='none';report('MAIN ENGINES SHUT DOWN');update()}
function damage(amount=15){if(state.shield>0){state.shield=Math.max(0,state.shield-amount);report('DEFLECTOR SHIELDS IMPACT — '+Math.round(state.shield)+'%');}else{let keys=Object.keys(state.parts),key=keys[Math.floor(Math.random()*keys.length)];state.parts[key]=Math.max(0,state.parts[key]-amount*1.7);state.hull=Math.round(Object.values(state.parts).reduce((a,b)=>a+b,0)/4);if(key==='engine')state.engine=state.parts.engine;report(key.toUpperCase()+' HIT — STRUCTURAL DAMAGE');paintParts()}stage.classList.add('shake','hitflash');spawnSparks();setTimeout(()=>stage.classList.remove('shake','hitflash'),420);update()}
function paintParts(){document.querySelectorAll('.part').forEach(el=>{let v=state.parts[el.dataset.part];el.style.fill=v<40?'#72291f':v<75?'#a36e36':'url(#armor)'})}
function scan(){let n=state.battle?3:2;state.contacts=Array.from({length:n},(_,i)=>({a:Math.random()*Math.PI*2,r:.25+Math.random()*.58,enemy:true}));state.lock=-1;report('LONG-RANGE SCAN — '+n+' CONTACTS DETECTED');update()}
function lock(){if(!state.contacts.length)return report('NO TARGETS — SCAN FIRST');state.lock=0;report('TARGET LOCK CONFIRMED — FIRE WHEN READY');update()}
function laser(){if(!state.online)return report('START MAIN ENGINES FIRST');if(!state.contacts.length)return report('NO CONTACTS IN RANGE');if(state.lock<0)return report('TARGET LOCK REQUIRED');state.contacts.splice(state.lock,1);state.lock=-1;report('LASER CANNONS FIRED — ENEMY HIT');update()}
function torpedo(){if(!state.online)return report('START MAIN ENGINES FIRST');if(!state.torps)return report('TORPEDO MAGAZINE EMPTY');state.torps--;if(state.lock>=0&&state.contacts.length){state.contacts.splice(state.lock,1);state.lock=-1;report('PROTON TORPEDO — TARGET DESTROYED')}else report('PROTON TORPEDO LAUNCHED — NO TARGET LOCK');update()}
function repair(){Object.keys(state.parts).forEach(k=>state.parts[k]=100);state.hull=100;state.engine=100;state.shield=Math.min(100,state.shield+35);paintParts();report('REPAIR DROIDS DEPLOYED — HULL RESTORED');update()}
function chargeDisplay(){
 $('chargeFill').style.width=state.charge+'%';$('chargeText').textContent='CHARGE '+state.charge+'%';
 let ready=state.charge===100&&!state.charging&&!state.jumping;
 $('jumpLever').classList.toggle('ready',ready);$('jumpLever').title=ready?'Engage hyperdrive':'Charge drive first';
 $('jumpLabel').textContent=state.jumping?'HYPERSPACE':ready?'ENGAGE DRIVE':state.charging?'CHARGING...':'HYPERDRIVE LOCKED';
}
function jump(){
 if(!state.online)return report('START MAIN ENGINES FIRST');
 if(state.jumping)return report('HYPERSPACE TRANSIT IN PROGRESS');
 if(state.charging)return report('HYPERDRIVE CHARGING — STAND BY');
 if(state.charge===100)return report('DRIVE READY — PULL THE HYPERDRIVE LEVER');
 state.charging=true;state.charge=0;chargeDisplay();report('HYPERDRIVE CHARGING — HOLD POSITION');
 const timer=setInterval(()=>{
  if(!state.charging||!state.online){clearInterval(timer);return}
  state.charge=Math.min(100,state.charge+10);chargeDisplay();
  if(state.charge>=100){clearInterval(timer);state.charging=false;chargeDisplay();report('HYPERDRIVE READY — ENGAGE THE LEVER');alertText('HYPERDRIVE READY')}
  else report('HYPERDRIVE CHARGING — '+state.charge+'%');
 },320);
}
const starCanvas=$('starfield'),starCtx=starCanvas.getContext('2d');
const stars=Array.from({length:300},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:.05+Math.random()*.95,b:Math.random()}));
let hyperFrame=0,hyperTimer=0;
function drawHyperspace(progress){
 const w=1536,h=1024,cx=w/2,cy=h/2;starCtx.fillStyle='#01040b';starCtx.fillRect(0,0,w,h);
 const speed=Math.min(1,progress*2.5),length=15+speed*460;
 starCtx.lineCap='round';
 for(const star of stars){
  let x=star.x*650/(star.z+.18),y=star.y*460/(star.z+.18),dist=Math.hypot(x,y)||1;
  let tx=x+ x/dist*length/(star.z+.25),ty=y+y/dist*length/(star.z+.25);
  starCtx.strokeStyle=star.b>.7?'#a8e8ff':'#e5efff';starCtx.globalAlpha=Math.min(.98,.3+speed*.6);
  starCtx.lineWidth=(star.b>.7?2.4:1.4)*(1+speed*.6);
  starCtx.beginPath();starCtx.moveTo(cx+x,cy+y);starCtx.lineTo(cx+tx,cy+ty);starCtx.stroke();
 }
 starCtx.globalAlpha=1;
 const glow=starCtx.createRadialGradient(cx,cy,0,cx,cy,500);
 glow.addColorStop(0,'rgba(153,220,255,'+(.18+speed*.55)+')');glow.addColorStop(.3,'rgba(30,90,190,'+(speed*.15)+')');glow.addColorStop(1,'transparent');
 starCtx.fillStyle=glow;starCtx.fillRect(0,0,w,h);
}
function engageHyperdrive(){
 if(!state.online)return report('START MAIN ENGINES FIRST');
 if(state.jumping)return;
 if(state.charging)return report('HYPERDRIVE STILL CHARGING');
 if(state.charge<100)return report('HYPERDRIVE NOT READY — CHARGE FIRST');
 state.jumping=true;state.battle=false;stage.classList.remove('combat-alert');
 $('jumpLever').classList.add('engaged');$('hyperspace').style.display='block';
 $('hyperspaceTitle').textContent='ENTERING HYPERSPACE';report('HYPERSPACE JUMP INITIATED');chargeDisplay();
 const start=performance.now();let last=0;
 function animate(now){
  if(!state.jumping)return;
  let t=Math.min(1,(now-start)/4200);
  if(now-last>30){drawHyperspace(t);last=now}
  if(t>.73&&t<.84)$('hyperFlash').classList.add('active');else $('hyperFlash').classList.remove('active');
  if(t<1){hyperFrame=requestAnimationFrame(animate);return}
  $('hyperspace').style.display='none';$('jumpLever').classList.remove('engaged');
  state.jumping=false;state.charge=0;state.contacts=[];state.lock=-1;state.throttle=25;
  chargeDisplay();update();report('HYPERSPACE JUMP COMPLETE — ARRIVED AT '+$('destination').value);alertText('ARRIVED: '+$('destination').value);
 }
 hyperFrame=requestAnimationFrame(animate);
}
$('jumpLever').addEventListener('click',engageHyperdrive);
function reset(){state.booting=false;state.online=false;stage.classList.remove('engines-on');state.throttle=0;state.shield=100;state.hull=100;state.engine=100;state.torps=3;state.contacts=[];state.lock=-1;state.charge=0;state.charging=false;state.jumping=false;cancelAnimationFrame(hyperFrame);$('hyperspace').style.display='none';$('hyperFlash').classList.remove('active');$('jumpLever').classList.remove('engaged');chargeDisplay();state.battle=false;stage.classList.remove('combat-alert','engines-on');state.parts={port:100,starboard:100,fuselage:100,engine:100};$('boot').style.display='none';paintParts();report('SHIP SYSTEMS RESET — READY FOR COMMAND');update()}

add('REPAIR SYSTEMS',1201,747,246,50,repair);
add('BATTLE STATIONS',150,895,267,89,()=>{state.battle=true;stage.classList.add('combat-alert');scan();alertText('BATTLE STATIONS');report('RED ALERT — INCOMING HOSTILE FIGHTERS')});

const switches=$('switches');for(let k of Object.keys(state.switches)){let b=document.createElement('button');b.className='toggle'+(state.switches[k]?'':' off');b.textContent=k;b.dataset.label=k;b.addEventListener('click',()=>{state.switches[k]=!state.switches[k];b.classList.toggle('off',!state.switches[k]);report(k+' '+(state.switches[k]?'ONLINE':'OFFLINE'))});switches.append(b)}
document.querySelectorAll('.route').forEach(b=>b.addEventListener('click',()=>{state.route=b.dataset.route;document.querySelectorAll('.route').forEach(x=>x.classList.toggle('selected',x===b));report('POWER ROUTED TO '+state.route);update()}));
function setThrottle(e){let r=$('throttle').getBoundingClientRect(),p=(e.clientY-r.top)/r.height;state.throttle=Math.max(0,Math.min(100,Math.round((1-(e.clientY-r.top-20)/(r.height-40))*100)));update();if(state.online)report('ENGINE THRUST — '+state.throttle+'%');else report('ENGINES OFFLINE — THROTTLE SET '+state.throttle+'%')}
$('throttle').addEventListener('pointerdown',e=>{$('throttle').setPointerCapture(e.pointerId);setThrottle(e)});$('throttle').addEventListener('pointermove',e=>{if(e.buttons)setThrottle(e)});
document.querySelectorAll('.part').forEach(el=>el.addEventListener('click',()=>{let k=el.dataset.part;$('partInfo').textContent=k.toUpperCase()+' INTEGRITY: '+state.parts[k]+'%';report(k.toUpperCase()+' SECTION — '+state.parts[k]+'% INTEGRITY')}));
function clock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('en-GB',{hour12:false})}clock();setInterval(clock,1000);
const c=$('scope'),ctx=c.getContext('2d');let tick=0;function draw(){tick+=.013;let R=182;ctx.clearRect(0,0,364,364);let g=ctx.createRadialGradient(R,R,0,R,R,R);g.addColorStop(0,'#043a2c');g.addColorStop(.65,'#001d17');g.addColorStop(1,'#000b09');ctx.fillStyle=g;ctx.fillRect(0,0,364,364);ctx.strokeStyle='#087e56';ctx.lineWidth=1;for(let r of [45,90,135,176]){ctx.beginPath();ctx.arc(R,R,r,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(R,4);ctx.lineTo(R,360);ctx.moveTo(4,R);ctx.lineTo(360,R);ctx.stroke();ctx.save();ctx.translate(R,R);ctx.rotate(tick);let beam=ctx.createRadialGradient(0,0,0,0,0,176);beam.addColorStop(0,'#25ffa05e');beam.addColorStop(1,'#0cff6b04');ctx.fillStyle=beam;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,176,-.27,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#53ffae';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(176,0);ctx.stroke();ctx.restore();state.contacts.forEach((o,i)=>{let x=R+Math.cos(o.a)*o.r*176,y=R+Math.sin(o.a)*o.r*176;ctx.fillStyle='#ff4e45';ctx.shadowColor='#ff4e45';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.shadowBlur=0;if(state.lock===i){ctx.strokeStyle='#ffb84a';ctx.strokeRect(x-13,y-13,26,26)}});requestAnimationFrame(draw)}draw();
setInterval(()=>{if(state.battle&&!state.jumping&&state.contacts.length&&state.online){damage($('difficulty').value==='LEGEND'?16:$('difficulty').value==='ACE'?11:7)}},6500);
chargeDisplay();update();
